[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepclaw"
version = "1.1.1"
description = "An Enterprise Agentic AI Security, Governance & Multi-Platform Orchestration Framework by SILICON VALLEY GLOBAL PH INC"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "SILICON VALLEY GLOBAL PH INC", email = "opensource@svg.ph" }
]
keywords = [
  "ai", "llm", "agent", "ai-agent", "agentic-ai", "ai-security",
  "ai-governance", "zero-trust", "policy-engine", "rbac", "sandbox",
  "audit-logger", "sso", "vulnerability-scanner", "mcp", "a2a", "evals",
  "deepclaw", "svgph", "siliconvalleyglobal"
]
dependencies = [
  "pydantic>=2.7.0",
  "litellm>=1.40.0",
  "mcp>=1.0.0",
  "httpx>=0.27.0",
  "typing-extensions>=4.11.0",
  "structlog>=24.1.0"
]

[project.urls]
Homepage = "https://svg.ph"
Documentation = "https://github.com/siliconvalleyglobal/DeepCLAW/tree/main/docs"
Repository = "https://github.com/siliconvalleyglobal/DeepCLAW.git"
Issues = "https://github.com/siliconvalleyglobal/DeepCLAW/issues"

[project.scripts]
deepclaw = "deepclaw.cli.main:cli_entry"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
