[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepclaw"
version = "0.1.0"
description = "An Enterprise-Governance-First Open Source AI Agent Framework"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "DeepClaw Contributors" }
]
dependencies = [
  "pydantic>=2.7.0",
  "litellm>=1.40.0",
  "mcp>=1.0.0",
  "httpx>=0.27.0",
  "typing-extensions>=4.11.0",
  "structlog>=24.1.0"
]

[project.scripts]
deepclaw = "deepclaw.cli.main:cli_entry"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
