name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm -r build

      - name: Publish core packages
        run: |
          cd packages/sdk && npm publish --access public
          cd ../gateway && npm publish --access public
          cd ../plugin-sdk && npm publish --access public
          cd ../core && npm publish --access public

      - name: Publish extensions
        run: |
          for ext in telegram discord slack mcp a2a webhook; do
            cd extensions/$ext && npm publish --access public
          done
